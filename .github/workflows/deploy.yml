name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sunnatulloh07/interviewai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 180s
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            mkdir -p ~/interviewai-pro && cd ~/interviewai-pro
            
            echo "📝 Creating .env..."
            cat > .env << 'EOF'
            NODE_ENV=production
            PORT=3000
            ALLOWED_ORIGINS=https://interviewai.pro,https://www.interviewai.pro
            
            MONGODB_URI=mongodb://${{ secrets.MONGODB_ROOT_USERNAME }}:${{ secrets.MONGODB_ROOT_PASSWORD }}@mongodb:27017/${{ secrets.MONGODB_DB_NAME }}?authSource=admin
            MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}
            MONGODB_ROOT_USERNAME=${{ secrets.MONGODB_ROOT_USERNAME }}
            MONGODB_ROOT_PASSWORD=${{ secrets.MONGODB_ROOT_PASSWORD }}
            
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DB=0
            
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_ACCESS_EXPIRATION=900
            JWT_REFRESH_EXPIRATION=604800
            
            OTP_LENGTH=6
            OTP_EXPIRY_MINUTES=5
            OTP_MAX_ATTEMPTS=3
            
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
            ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
            ADMIN_BOT_TOKEN=${{ secrets.ADMIN_BOT_TOKEN }}
            
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}
            OPENROUTER_BASE_URL=${{ secrets.OPENROUTER_BASE_URL }}
            OPENROUTER_HTTP_REFERER=${{ secrets.OPENROUTER_HTTP_REFERER }}
            OPENROUTER_X_TITLE=${{ secrets.OPENROUTER_X_TITLE }}
            
            GEMINI_AUDIO_ENABLED=${{ secrets.GEMINI_AUDIO_ENABLED }}
            GEMINI_AUDIO_MODEL=${{ secrets.GEMINI_AUDIO_MODEL }}
            
            LOCAL_UPLOAD_PATH=./uploads
            EOF
            
            
            echo "📦 Creating docker-compose.prod.yml..."
            cat > docker-compose.prod.yml << 'COMPOSE_EOF'
            services:
              api:
                image: ghcr.io/sunnatulloh07/interviewai:latest
                container_name: interviewai-api
                restart: unless-stopped
                ports:
                  - '3000:3000'
                env_file:
                  - .env
                environment:
                  - MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
                  - REDIS_HOST=redis
                  - REDIS_PORT=6379
                  - REDIS_PASSWORD=${REDIS_PASSWORD}
                depends_on:
                  - mongodb
                  - redis
                networks:
                  - app-network
            
              mongodb:
                image: mongo:7.0
                container_name: interviewai-mongodb
                restart: unless-stopped
                environment:
                  MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
                  MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
                  MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME}
                ports:
                  - '127.0.0.1:27017:27017'
                volumes:
                  - mongodb_data:/data/db
                networks:
                  - app-network
            
              redis:
                image: redis:7-alpine
                container_name: interviewai-redis
                restart: unless-stopped
                command: redis-server --requirepass ${REDIS_PASSWORD}
                ports:
                  - '127.0.0.1:6379:6379'
                volumes:
                  - redis_data:/data
                networks:
                  - app-network
            
            networks:
              app-network:
                driver: bridge
            
            volumes:
              mongodb_data:
              redis_data:
            COMPOSE_EOF
            
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "⬇️ Pulling images..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down || true
            
            echo "▶️ Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "⏳ Waiting 20s..."
            sleep 20
            
            echo "✅ Checking status..."
            docker ps
            
            if ! docker ps | grep -q interviewai-api; then
              echo "❌ API container failed!"
              docker logs interviewai-api --tail 100
              exit 1
            fi
            
            echo "🎉 Deployment successful!"

