name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sunnatulloh07/interviewai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 180s
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            mkdir -p ~/interviewai-pro && cd ~/interviewai-pro
            
            echo "📝 Creating .env..."
            cat > .env << 'EOF'
            NODE_ENV=production
            PORT=3000
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}
            MONGODB_ROOT_USERNAME=${{ secrets.MONGODB_ROOT_USERNAME }}
            MONGODB_ROOT_PASSWORD=${{ secrets.MONGODB_ROOT_PASSWORD }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
            OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}
            OPENROUTER_BASE_URL=${{ secrets.OPENROUTER_BASE_URL }}
            OPENROUTER_HTTP_REFERER=${{ secrets.OPENROUTER_HTTP_REFERER }}
            OPENROUTER_X_TITLE=${{ secrets.OPENROUTER_X_TITLE }}
            GEMINI_AUDIO_ENABLED=${{ secrets.GEMINI_AUDIO_ENABLED }}
            GEMINI_AUDIO_MODEL=${{ secrets.GEMINI_AUDIO_MODEL }}
            ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
            ADMIN_BOT_TOKEN=${{ secrets.ADMIN_BOT_TOKEN }}
            EOF
            
            echo "📦 Downloading docker-compose.prod.yml..."
            wget -q https://raw.githubusercontent.com/Sunnatulloh07/InterviewAI/main/docker-compose.prod.yml -O docker-compose.prod.yml
            
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "⬇️ Pulling images..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down || true
            
            echo "▶️ Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "⏳ Waiting 20s..."
            sleep 20
            
            echo "✅ Checking status..."
            docker ps
            
            if ! docker ps | grep -q interviewai-api; then
              echo "❌ API container failed!"
              docker logs interviewai-api --tail 100
              exit 1
            fi
            
            echo "🎉 Deployment successful!"

