name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sunnatulloh07/jobi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug workflow info
        run: |
          echo "🔍 Workflow triggered by: ${{ github.event_name }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "⏰ Started at: $(date)"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        timeout-minutes: 25
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          
      - name: Verify build success
        if: success()
        run: echo "✅ Docker image built and pushed successfully"
        
      - name: Build failed notification
        if: failure()
        run: |
          echo "❌ Docker build failed!"
          echo "Check the build logs above for errors"
          exit 1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 300s
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            mkdir -p ~/jobi && cd ~/jobi
            
            echo "📝 Creating .env..."
            cat > .env << 'EOF'
            NODE_ENV=production
            PORT=3000
            TZ=UTC
            ALLOWED_ORIGINS=https://getjobi.app,https://www.getjobi.app
            
            MONGODB_URI=mongodb://${{ secrets.MONGODB_ROOT_USERNAME }}:${{ secrets.MONGODB_ROOT_PASSWORD }}@mongodb:27017/${{ secrets.MONGODB_DB_NAME }}?authSource=admin
            MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}
            MONGODB_ROOT_USERNAME=${{ secrets.MONGODB_ROOT_USERNAME }}
            MONGODB_ROOT_PASSWORD=${{ secrets.MONGODB_ROOT_PASSWORD }}
            
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DB=0
            
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_ACCESS_EXPIRATION=900
            JWT_REFRESH_EXPIRATION=604800
            
            OTP_LENGTH=6
            OTP_EXPIRY_MINUTES=5
            OTP_MAX_ATTEMPTS=3
            
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
            ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
            ADMIN_BOT_TOKEN=${{ secrets.ADMIN_BOT_TOKEN }}
            
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}
            OPENROUTER_BASE_URL=${{ secrets.OPENROUTER_BASE_URL }}
            OPENROUTER_HTTP_REFERER=${{ secrets.OPENROUTER_HTTP_REFERER }}
            OPENROUTER_X_TITLE=${{ secrets.OPENROUTER_X_TITLE }}
            
            GEMINI_AUDIO_ENABLED=${{ secrets.GEMINI_AUDIO_ENABLED }}
            GEMINI_AUDIO_MODEL=${{ secrets.GEMINI_AUDIO_MODEL }}
            
            LOCAL_UPLOAD_PATH=./uploads
            EOF
            
            
            echo "📦 Creating docker-compose.prod.yml..."
            cat > docker-compose.prod.yml << 'COMPOSE_EOF'
            services:
              api:
                image: ghcr.io/sunnatulloh07/jobi:latest
                container_name: jobi-api
                restart: unless-stopped
                ports:
                  - '3000:3000'
                env_file:
                  - .env
                environment:
                  - TZ=UTC
                  - MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
                  - REDIS_HOST=redis
                  - REDIS_PORT=6379
                  - REDIS_PASSWORD=${REDIS_PASSWORD}
                depends_on:
                  mongodb:
                    condition: service_started
                  redis:
                    condition: service_started
                networks:
                  - app-network
            
              mongodb:
                image: mongo:7.0
                container_name: jobi-mongodb
                restart: unless-stopped
                environment:
                  MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
                  MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
                  MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME}
                volumes:
                  - mongodb_data:/data/db
                networks:
                  - app-network
            
              redis:
                image: redis:7-alpine
                container_name: jobi-redis
                restart: unless-stopped
                command: redis-server --requirepass ${REDIS_PASSWORD}
                volumes:
                  - redis_data:/data
                networks:
                  - app-network
            
            networks:
              app-network:
                driver: bridge
            
            volumes:
              mongodb_data:
              redis_data:
            COMPOSE_EOF
            
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "⬇️ Pulling images..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "🛑 Stopping ALL Docker containers using our names..."
            docker stop jobi-api jobi-mongodb jobi-redis 2>/dev/null || true
            docker rm -f jobi-api jobi-mongodb jobi-redis 2>/dev/null || true
            
            echo "🛑 Stopping any compose project in this directory..."
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
            
            echo "🔌 Finding what holds port 3000..."
            ss -tlnp | grep 3000 || echo "No process on 3000"
            
            echo "🔌 Stopping ALL Docker containers binding to port 3000..."
            docker ps -q --filter "publish=3000" | xargs -r docker stop 2>/dev/null || true
            docker ps -aq --filter "publish=3000" | xargs -r docker rm -f 2>/dev/null || true
            
            echo "🔌 Killing any remaining process on port 3000 (SIGKILL)..."
            fuser -k -9 3000/tcp 2>/dev/null || true
            sleep 2
            fuser -k -9 3000/tcp 2>/dev/null || true
            sleep 3
            
            echo "🔍 Verifying port 3000 is free..."
            if ss -tlnp | grep -q ':3000 '; then
              echo "⚠️ Port 3000 still occupied! Showing details:"
              ss -tlnp | grep 3000
              echo "Attempting final force cleanup..."
              fuser -k -9 3000/tcp 2>/dev/null || true
              sleep 5
            fi
            
            echo "▶️ Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "⏳ Waiting 20s..."
            sleep 20
            
            echo "✅ Checking status..."
            docker ps
            
            if ! docker ps | grep -q jobi-api; then
              echo "❌ API container failed!"
              docker logs jobi-api --tail 100
              exit 1
            fi
            
            echo "🎉 Deployment successful!"

